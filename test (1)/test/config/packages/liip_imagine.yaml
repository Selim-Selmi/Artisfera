liip_imagine:
    driver: "gd" # Ou "imagick" si installé
    resolvers:
        default:
            web_path: ~
    filter_sets:
        cache: ~
        thumbnail:
            quality: 75
            filters:
                thumbnail: { size: [200, 200], mode: inset }
        large:
            quality: 85
            filters:
                thumbnail: { size: [800, 800], mode: scale }
